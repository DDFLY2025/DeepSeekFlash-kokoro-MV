<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111214'/%3E%3Crect x='3' y='4' width='2' height='9' fill='%23f4f5f7'/%3E%3Crect x='7' y='4' width='2' height='5' fill='%23ffc247'/%3E%3Crect x='11' y='4' width='2' height='9' fill='%23f4f5f7'/%3E%3C/svg%3E">
<title>ココロ OS — a music film</title>
<!--
  =========================================================================
  KOKORO.OS  //  ココロ  (トラボルタP / 鏡音リン)

  A music film about an operating system that boots without a heart and
  spends four minutes forty-two seconds installing one.

  · Time base ...... audio.currentTime only; the frame is a pure function
                     of t, so pause / scrub / seek always render correctly.
  · Look ........... deep grey pinstripes, flat white primitives, syntax
                     highlight accents (purple / green / amber / cyan),
                     cyan + gold as the only warm poles.
  · 2D + 3D ........ one custom 3D projector drawing into Canvas2D, so the
                     same frame can hold real typeset code, typeset maths
                     and a rotating tesseract.
  · No dependencies, no network, no build. Double-click this file.

  Keys  space play · ←/→ ±5s · shift+←/→ ±1s · home/end · r restart
        f fullscreen · m mute · h hide ui · [ ] sync ±10ms · , . lyric ±10ms
  =========================================================================
-->
<style>
  :root{
    --ink:#f4f5f7;
    --dim:rgba(244,245,247,.42);
    --faint:rgba(244,245,247,.18);
    --gold:#ffc247;
    --cyan:#5ee7ff;
    --line:rgba(244,245,247,.16);
    --mono:"Cascadia Mono",Consolas,"SF Mono","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Microsoft YaHei",monospace;
    --ui:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:var(--mono);color:var(--ink);-webkit-font-smoothing:antialiased;cursor:default}
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  #cv{position:absolute;left:0;top:0;display:block}

  /* ---------------- CRT furniture ---------------- */
  .fx{position:absolute;inset:0;pointer-events:none}
  #scan{z-index:6;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,.26) 0px, rgba(0,0,0,.26) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
    opacity:.5}
  #vig{z-index:7;
    background:radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 42%, rgba(0,0,0,.30) 76%, rgba(0,0,0,.72) 100%)}
  #roll{z-index:6;opacity:.10;
    background:linear-gradient(180deg,transparent 0%,rgba(180,235,255,.10) 46%,rgba(180,235,255,.16) 50%,transparent 54%);
    animation:roll 11s linear infinite}
  @keyframes roll{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
  #flick{z-index:5;background:rgba(200,240,255,.014);animation:flick 6.2s steps(2,end) infinite}
  @keyframes flick{0%,96%{opacity:0}97%{opacity:1}98%{opacity:.3}100%{opacity:0}}

  /* ---------------- poster ---------------- */
  #poster{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(6,7,9,.94),rgba(0,0,0,.985));
    transition:opacity .8s ease,visibility .8s;cursor:pointer}
  #poster.gone{opacity:0;visibility:hidden}
  .pbox{position:relative;padding:44px 56px 34px;border:1px solid var(--line);
    background:rgba(9,10,12,.86);min-width:min(680px,88vw);text-align:left}
  .pbox:before,.pbox:after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--ink);opacity:.55}
  .pbox:before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .pbox:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  .ptag{font-size:10px;letter-spacing:.34em;color:var(--dim);margin-bottom:16px}
  .ptitle{font-size:66px;line-height:1;letter-spacing:.06em;font-weight:300;color:#fff}
  .ptitle em{font-style:normal;color:var(--gold);letter-spacing:.02em}
  .psub{margin-top:14px;font-size:12.5px;letter-spacing:.30em;color:var(--cyan)}
  .pmeta{margin-top:24px;font-size:12px;line-height:1.95;color:rgba(244,245,247,.46);letter-spacing:.04em}
  .pmeta b{color:var(--gold);font-weight:400;font-family:var(--mono)}
  .prow{display:flex;gap:8px;margin-top:24px}
  #start{flex:1;background:transparent;color:var(--ink);border:1px solid var(--ink);
    padding:12px 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.30em;cursor:pointer;
    transition:background .18s,color .18s}
  #start:hover{background:var(--ink);color:#0a0b0c}
  #start2{background:transparent;border:1px solid var(--line);color:var(--dim);
    padding:12px 16px;font-family:var(--mono);font-size:12.5px;cursor:pointer}
  #start2:hover{color:var(--ink);border-color:var(--ink)}
  .pkbd{margin-top:18px;font-size:10px;color:rgba(244,245,247,.28);letter-spacing:.06em}

  /* ---------------- loading ---------------- */
  #loading{position:absolute;left:0;right:0;bottom:0;z-index:30;transition:opacity .5s;font-size:10px;color:var(--dim)}
  #loading.gone{opacity:0;pointer-events:none}
  #loadingtrack{height:2px;width:100%;background:rgba(244,245,247,.08)}
  #loadingbar{height:100%;width:0%;background:var(--ink);transition:width .3s}

  /* ---------------- transport ---------------- */
  #ui{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:linear-gradient(180deg,rgba(6,7,9,0),rgba(6,7,9,.86) 40%,rgba(6,7,9,.96));
    border-top:1px solid rgba(244,245,247,.10);opacity:0;transform:translateY(6px);
    transition:opacity .3s ease,transform .3s ease;font-size:12px;letter-spacing:.05em}
  body.ui #ui{opacity:1;transform:none}
  body.bare #ui{display:none}
  body:not(.started) #ui{opacity:0;pointer-events:none}
  body.playing:not(.ui){cursor:none}
  #ui button{background:transparent;border:1px solid rgba(244,245,247,.16);color:var(--ink);
    font-family:var(--mono);font-size:12px;line-height:1;width:30px;height:26px;cursor:pointer;transition:all .15s}
  #ui button:hover{border-color:var(--ink);background:rgba(244,245,247,.10)}
  #tc{color:rgba(244,245,247,.8);min-width:92px;font-size:12px;font-variant-numeric:tabular-nums}
  #seekwrap{position:relative;flex:1;height:26px;display:flex;align-items:center}
  #seekfill{position:absolute;left:0;top:50%;height:1px;margin-top:-0.5px;
    background:linear-gradient(90deg,rgba(244,245,247,.5),var(--gold));pointer-events:none;width:0}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px;width:100%;
    cursor:pointer;position:relative;z-index:2}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(244,245,247,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:12px;margin-top:-5.5px;
    background:var(--ink);border:0}
  input[type=range]::-moz-range-track{height:1px;background:rgba(244,245,247,.18)}
  input[type=range]::-moz-range-thumb{width:3px;height:12px;border:0;background:var(--ink)}
  .ctl{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .ctl label{color:rgba(244,245,247,.30);font-size:9px;letter-spacing:.18em}
  .ctl .val{color:var(--gold);min-width:40px;font-size:11px;font-variant-numeric:tabular-nums}
  .ctl input[type=range]{width:62px}
  @media (max-width:1180px){ .ctl.lyr{display:none} }
  @media (max-width:860px){
    .ctl.sync,.ctl.vol{display:none}
    #ui{gap:6px;padding:7px 8px}
    #tc{min-width:66px;font-size:10px}
  }
</style>
</head>
<body class="ui">

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="fx" id="flick"></div>
  <div class="fx" id="scan"></div>
  <div class="fx" id="roll"></div>
  <div class="fx" id="vig"></div>

  <div id="poster">
    <div class="pbox">
      <div class="ptag">MUSIC FILM  /  04:42.800  /  140.00 BPM</div>
      <div class="ptitle">ココロ<em> OS</em></div>
      <div class="psub">KOKORO.OS &nbsp;//&nbsp; 一颗会流泪的奇迹</div>
      <div class="pmeta">
        トラボルタP &nbsp;/&nbsp; 鏡音リン<br>
        14 segments &nbsp;·&nbsp; 57 shots &nbsp;·&nbsp; 39 lines &nbsp;·&nbsp; 7 languages<br>
        <b>heart.sys</b> &nbsp;—&nbsp; installation pending
      </div>
      <div class="prow">
        <button id="start">▶&nbsp;&nbsp;BOOT</button>
        <button id="start2" title="从开头播放">↺</button>
      </div>
      <div class="pkbd">space 播放 · ←/→ 跳转 · [ ] 整体同步 · , . 只调歌词 · f 全屏 · h 隐藏界面</div>
    </div>
  </div>

  <div id="loading"><div id="loadingtrack"><div id="loadingbar"></div></div></div>

  <div id="ui">
    <button id="play" aria-label="play">▶</button>
    <button id="restart" aria-label="restart">↺</button>
    <span id="tc">00:00.000</span>
    <div id="seekwrap"><div id="seekfill"></div>
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="seek">
    </div>
    <div class="ctl sync">
      <label>SYNC</label>
      <input id="off" type="range" min="-400" max="400" step="1" value="0" aria-label="sync offset">
      <span class="val" id="offout">+0</span>
    </div>
    <div class="ctl lyr">
      <label>LYRIC</label>
      <input id="lyr" type="range" min="-400" max="400" step="1" value="0" aria-label="lyric offset">
      <span class="val" id="lyrout">+0</span>
    </div>
    <div class="ctl vol">
      <label>VOL</label>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="volume">
    </div>
    <button id="fs" aria-label="fullscreen">⛶</button>
  </div>
</div>

<audio id="audio" src="assets/kokoro.mp3" preload="auto"></audio>

<script src="js/song.js"></script>
<script src="js/core.js"></script>
<script src="js/code.js"></script>
<script src="js/math.js"></script>
<script src="js/g3d.js"></script>
<script src="js/viz.js"></script>
<script src="js/ui.js"></script>
<script src="js/scenes.js"></script>
<script src="js/scenes2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
